<f:layout name="Default"/>
<f:section name="Main">
    <f:if condition="{testimonials}">
        <f:asset.script identifier="ot-testimonials-js"
                        src="EXT:ot_testimonials/Resources/Public/JavaScript/OtTestimonials.js"
                        defer="defer"/>

        <section class="ot-testimonials"
                 role="region"
                 aria-label="{f:translate(key: 'slider.regionLabel', extensionName: 'ot_testimonials')}"
                 data-js="testimonialSlider"
                 data-interval="{settings.interval}"
                 data-autoplay="{settings.autoplay}"
                 data-indicator="{settings.indicator}"
                 data-label-page="{f:translate(key: 'indicator.page', extensionName: 'ot_testimonials')}"
                 data-label-current="{f:translate(key: 'indicator.current', extensionName: 'ot_testimonials')}">

            <div class="ot-testimonials-track" aria-live="off">
                <f:for each="{testimonials}" as="testimonial" iteration="iteration">
                    <f:render partial="Testimonial/Slide"
                              arguments="{testimonial: testimonial, iteration: iteration}"/>
                </f:for>
            </div>

            <div class="ot-testimonials-controls" aria-label="{f:translate(key: 'slider.controlsLabel', extensionName: 'ot_testimonials')}">
                <button class="ot-testimonials-btn ot-testimonials-btn-prev"
                        type="button"
                        data-js="testimonialPrev"
                        aria-label="{f:translate(key: 'slider.prev', extensionName: 'ot_testimonials')}">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                        <path d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
                    </svg>
                </button>

                <button class="ot-testimonials-btn ot-testimonials-btn-pause"
                        type="button"
                        data-js="testimonialPause"
                        aria-pressed="false"
                        aria-label="{f:translate(key: 'slider.pause', extensionName: 'ot_testimonials')}">
                    <svg class="ot-testimonials-icon-pause" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                        <path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5zm5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5z"/>
                    </svg>
                    <svg class="ot-testimonials-icon-play" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                        <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>
                    </svg>
                </button>

                <button class="ot-testimonials-btn ot-testimonials-btn-next"
                        type="button"
                        data-js="testimonialNext"
                        aria-label="{f:translate(key: 'slider.next', extensionName: 'ot_testimonials')}">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                        <path d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/>
                    </svg>
                </button>
            </div>

            <div class="ot-testimonials-progress" aria-hidden="true">
                <div class="ot-testimonials-progress-bar" data-js="testimonialProgressBar"></div>
            </div>

            <f:if condition="{settings.flexForm.indicator} != 'none'">
                <div class="ot-testimonials-indicator"
                     data-js="testimonialIndicator"
                     aria-hidden="true"></div>
            </f:if>
        </section>

        <f:if condition="{structuredData}">
            <f:format.raw>{structuredData}</f:format.raw>
        </f:if>
    </f:if>
</f:section>
